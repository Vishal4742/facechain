name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (no model download; model-backed tests skip)
        run: |
          python -m pip install -U pip
          pip install -e . ruff pyright pytest pytest-cov
      - run: ruff check . && ruff format --check .
      - run: pyright
      - run: pytest -q
        env:
          FACECHAIN_SKIP_MODEL: "1"
